name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Import verified assets
        shell: pwsh
        run: .\import-assets.ps1

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build release
        run: cargo build --release

      - name: Stage self-contained package
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'target\release'
          $dest = Join-Path $PWD 'dist\CatCPU'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          Copy-Item (Join-Path $source 'catcpu.exe') $dest
          Copy-Item (Join-Path $source 'catcpu-settings.exe') $dest

          Get-ChildItem $source -File | Where-Object {
            $_.Extension -in @('.dll', '.pri', '.xaml')
          } | ForEach-Object {
            Copy-Item $_.FullName $dest
          }

          Get-ChildItem $source -Directory | Where-Object {
            $_.Name -notin @('build', 'deps', 'examples', 'incremental')
          } | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $dest $_.Name) -Recurse
          }

          if (-not (Test-Path (Join-Path $dest 'catcpu.exe'))) { throw 'catcpu.exe was not staged' }
          if (-not (Test-Path (Join-Path $dest 'catcpu-settings.exe'))) { throw 'catcpu-settings.exe was not staged' }
          if (-not (Test-Path (Join-Path $dest 'Microsoft.WindowsAppRuntime.dll'))) { throw 'Windows App SDK runtime was not staged' }

      - name: Upload self-contained app
        uses: actions/upload-artifact@v4
        with:
          name: catcpu-windows-x64
          path: dist/CatCPU
          if-no-files-found: error
