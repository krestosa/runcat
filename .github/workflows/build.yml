name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Import verified assets
        shell: pwsh
        run: .\import-assets.ps1

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build release
        run: cargo build --release

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: catcpu-windows-x64
          path: target/release/catcpu.exe
          if-no-files-found: error
